<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FUNAAB Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex h-screen bg-gray-100">
        <!-- Sidebar -->
        <div class="w-64 bg-emerald-900 text-white hidden md:block">
            <div class="p-5 text-2xl font-bold tracking-wider">FUNAAB Hub Admin</div>
            <nav class="mt-5">
                <a href="#" class="block py-2.5 px-4 rounded transition duration-200 bg-emerald-800 text-white">Dashboard</a>
                <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-emerald-800">Manage Resources</a>
                <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-emerald-800">Portals & Links</a>
                <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-emerald-800">Announcements</a>
                <a href="index.html" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-emerald-800 mt-10 text-red-300">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Header -->
            <header class="bg-white shadow-sm z-10 p-4 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-gray-800">Dashboard Overview</h1>
                <div class="flex items-center space-x-3">
                    <span class="text-gray-600 text-sm">Welcome, Admin</span>
                    <div class="w-8 h-8 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold">A</div>
                </div>
            </header>

            <!-- Dashboard Body -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                        <h3 class="text-gray-500 text-sm font-medium">Total Resources</h3>
                        <p class="text-3xl font-bold text-gray-800 mt-2">124</p>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                        <h3 class="text-gray-500 text-sm font-medium">Active Portals</h3>
                        <p class="text-3xl font-bold text-gray-800 mt-2">6</p>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                        <h3 class="text-gray-500 text-sm font-medium">Site Visits</h3>
                        <p class="text-3xl font-bold text-gray-800 mt-2">1,450</p>
                    </div>
                </div>

                <!-- Quick Action Form: Upload Resource / Post News -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
                    <h2 class="text-lg font-medium text-gray-800 mb-4">Upload New Past Question / Material</h2>
                    <form action="#" method="POST" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Course Code</label>
                                <input type="text" placeholder="e.g. MTH 101" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-emerald-500 focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Category</label>
                                <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-white">
                                    <option>Past Questions</option>
                                    <option>Lecture Notes</option>
                                    <option>Academic Calendar</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Resource File / Link</label>
                            <input type="file" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                        </div>
                        <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded-md hover:bg-emerald-700 transition">Publish Resource</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
